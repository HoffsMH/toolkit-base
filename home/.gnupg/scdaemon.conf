# scdaemon configuration, shipped by the base toolkit.

# Use pcscd instead of gpg's internal CCID driver. pcscd owns the YubiKey's
# USB device node (root:pcscd) and this user isn't in the pcscd group, so the
# internal driver fails with "ccid open error: skip" -> "No such device".
disable-ccid
# Don't claim the reader exclusively, so ykman/pcsc-tools still work.
pcsc-shared
# Keep scdaemon on the OpenPGP applet. Switching to PIV and back drops the
# card's verified-PIN state, so every ssh auth (e.g. herdr dialing several
# hosts) prompts for the PIN again. ykman and PKCS#11 reach PIV without
# scdaemon, so they are unaffected.
disable-application piv
