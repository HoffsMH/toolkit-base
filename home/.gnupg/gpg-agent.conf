# gpg-agent configuration, shipped by the base toolkit. Identical on every
# platform; see the pinentry note at the bottom.

# Make gpg-agent also serve as the SSH agent (so the YubiKey AUT subkey is
# offered for SSH auth via $SSH_AUTH_SOCK).
enable-ssh-support

# Cache the PIN so YubiKey touches don't require re-typing it constantly,
# while still expiring within a session.
default-cache-ttl 600
max-cache-ttl 7200

# Pinentry is chosen per platform by a wrapper, so this file stays the
# same on every machine. gpg-agent expands ~ here.
pinentry-program ~/bin/pinentry-dispatch
